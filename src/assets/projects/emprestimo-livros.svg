<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#854cc7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="96%" height="94%" x="2%" y="3%" fill="none" stroke="#1e293b" stroke-width="2" rx="16" />

  <!-- Code/Grid Overlay -->
  <path d="M 0,40 L 400,40 M 0,80 L 400,80 M 0,120 L 400,120 M 0,160 L 400,160 M 0,200 L 400,200" stroke="#1e293b" stroke-width="0.5" opacity="0.3" />
  <path d="M 80,0 L 80,250 M 160,0 L 160,250 M 240,0 L 240,250 M 320,0 L 320,250" stroke="#1e293b" stroke-width="0.5" opacity="0.3" />

  <!-- Book stack visual -->
  <g transform="translate(130, 75)">
    <!-- Book 1 (Bottom, Violet) -->
    <rect x="0" y="50" width="140" height="24" rx="4" fill="#854cc7" opacity="0.8" />
    <rect x="10" y="54" width="120" height="4" rx="1" fill="#a78bfa" />
    <path d="M 120,50 L 140,50 L 140,74 L 120,74 Z" fill="#6d28d9" />

    <!-- Book 2 (Middle, Blue) -->
    <rect x="15" y="22" width="115" height="24" rx="4" fill="#2563eb" />
    <rect x="25" y="26" width="95" height="4" rx="1" fill="#60a5fa" />
    <path d="M 110,22 L 130,22 L 130,46 L 110,46 Z" fill="#1d4ed8" />

    <!-- Book 3 (Top, Cyan) -->
    <rect x="30" y="-6" width="80" height="24" rx="4" fill="#06b6d4" />
    <rect x="40" y="-2" width="60" height="4" rx="1" fill="#22d3ee" />
    <path d="M 90,-6 L 110,-6 L 110,18 L 90,18 Z" fill="#0891b2" />
  </g>

  <!-- Exchange/Lending Arrows -->
  <g transform="translate(120, 60)" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow Left-to-Right -->
    <path d="M 10,20 C 30,0, 130,0, 150,20" />
    <polygon points="152,22 145,15 149,24" fill="#06b6d4" stroke="none" />

    <!-- Arrow Right-to-Left -->
    <path d="M 150,80 C 130,100, 30,100, 10,80" />
    <polygon points="8,78 15,85 11,76" fill="#06b6d4" stroke="none" />
  </g>

  <!-- User badges -->
  <g transform="translate(50, 100)" opacity="0.85">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="15" r="6" fill="#94a3b8" />
    <path d="M 8,29 C 8,24, 32,24, 32,29 Z" fill="#94a3b8" />
  </g>
  <g transform="translate(310, 100)" opacity="0.85">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#854cc7" stroke-width="1.5" />
    <circle cx="20" cy="15" r="6" fill="#94a3b8" />
    <path d="M 8,29 C 8,24, 32,24, 32,29 Z" fill="#94a3b8" />
  </g>

  <!-- C# / .NET tag -->
  <text x="200" y="210" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">
    &lt; C# / ASP.NET MVC &gt;
  </text>
</svg>
